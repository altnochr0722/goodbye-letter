<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Farewell Note</title>
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 50%, #f48fb1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Playfair Display', serif;
            overflow: hidden;
            position: relative;
        }

        /* Music Playlist Container */
        .playlist-container {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
        }

        .playlist-toggle {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid #f8bbd0;
            border-radius: 20px;
            padding: 8px 15px;
            font-size: 0.9rem;
            color: #880e4f;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            font-family: 'Playfair Display', serif;
        }

        .playlist-toggle:hover {
            background: #ffffff;
            transform: translateY(-2px);
        }

        .song-menu {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #f8bbd0;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            min-width: 180px;
        }

        .song-menu.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .song-btn {
            background: #fff8f9;
            border: 1px solid #f8bbd0;
            border-radius: 8px;
            padding: 8px 12px;
            color: #880e4f;
            font-family: 'Playfair Display', serif;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .song-btn:hover {
            background: #f8bbd0;
            color: #ffffff;
        }

        .song-btn.selected {
            background: #f06292;
            color: #ffffff;
            border-color: #ec407a;
        }

        .audio-toggle {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid #f8bbd0;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            font-size: 1rem;
            color: #880e4f;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
        }

        .audio-toggle:hover {
            background: #ffffff;
            transform: scale(1.05);
        }

        /* Decorative Background Elements */
        .bg-decor {
            position: absolute;
            pointer-events: none;
            opacity: 0.7;
            user-select: none;
        }
        .flower-top-left { top: -10px; left: -10px; font-size: 5.5rem; transform: rotate(-20deg); }
        .flower-top-right { top: -10px; right: -10px; font-size: 5.5rem; transform: rotate(20deg); }
        .flower-bottom-left { bottom: -10px; left: -10px; font-size: 5.5rem; transform: rotate(-15deg); }
        .flower-bottom-right { bottom: -10px; right: -10px; font-size: 6rem; transform: rotate(15deg); }
        
        .charm-1 { top: 15%; right: 18%; font-size: 2.5rem; animation: float 4s ease-in-out infinite; }
        .charm-2 { bottom: 22%; left: 12%; font-size: 2.2rem; animation: float 5s ease-in-out infinite 1s; }
        .charm-3 { top: 28%; left: 18%; font-size: 1.8rem; animation: float 3.5s ease-in-out infinite 0.5s; }
        .charm-4 { bottom: 18%; right: 15%; font-size: 2rem; animation: float 4.5s ease-in-out infinite 1.5s; }
        .charm-5 { top: 10%; left: 50%; transform: translateX(-50%); font-size: 1.6rem; animation: twinkle 2s infinite ease-in-out; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(6deg); }
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: translateX(-50%) scale(0.8); }
            50% { opacity: 1; transform: translateX(-50%) scale(1.2); }
        }

        .petal {
            position: absolute;
            top: -10%;
            font-size: 1.2rem;
            pointer-events: none;
            opacity: 0.8;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0.2; }
        }

        /* Envelope Stage Container */
        .stage {
            position: relative;
            width: 340px;
            height: 280px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .top-note {
            font-size: 1rem;
            color: #880e4f;
            font-style: italic;
            text-align: center;
            margin-bottom: 20px;
            opacity: 0.95;
            transition: opacity 0.6s ease, transform 0.6s ease;
            pointer-events: none;
            line-height: 1.5;
            max-width: 340px;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.6);
        }

        .wrapper {
            position: relative;
            width: 320px;
            height: 220px;
            cursor: pointer;
            z-index: 10;
            transition: transform 0.8s ease, opacity 0.8s ease;
        }

        .envelope {
            width: 100%;
            height: 100%;
            background-color: #f8bbd0;
            position: relative;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
            box-shadow: 0 15px 35px rgba(186, 104, 200, 0.3);
        }

        .wrapper:hover:not(.open) { transform: translateY(-5px); }

        .flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 160px solid transparent;
            border-right: 160px solid transparent;
            border-top: 120px solid #f06292;
            transform-origin: top;
            transition: transform 0.5s ease;
            z-index: 4;
        }

        .pocket {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 160px solid #f48fb1;
            border-right: 160px solid #f48fb1;
            border-bottom: 110px solid #ec407a;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
            z-index: 3;
        }

        .wax-seal {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 55px;
            height: 55px;
            background: radial-gradient(circle, #ffd700 0%, #daa520 70%, #b8860b 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            z-index: 5;
            transition: opacity 0.3s ease, transform 0.3s ease;
            font-size: 1.4rem;
        }

        .hint-text {
            position: absolute;
            bottom: -35px;
            width: 100%;
            text-align: center;
            color: #880e4f;
            font-size: 0.95rem;
            letter-spacing: 1px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* Letter Paper */
        .letter {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 440px;
            max-width: 90vw;
            height: 75vh;
            max-height: 550px;
            background: #fff8f9;
            border-radius: 12px;
            padding: 35px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            z-index: 2;
            opacity: 0;
            visibility: hidden;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s ease, visibility 0.8s;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            border: 2px solid #f8bbd0;
        }

        .letter-content {
            font-family: 'Caveat', cursive;
            font-size: 1.6rem;
            color: #4a148c;
            line-height: 1.6;
            white-space: pre-wrap;
            flex-grow: 1;
        }

        .action-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px dashed #f8bbd0;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .action-btn {
            background: #f8bbd0;
            color: #880e4f;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-family: 'Playfair Display', serif;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .action-btn:hover {
            background: #f48fb1;
            color: white;
            transform: translateY(-2px);
        }

        /* Opening Animations */
        .stage.open .top-note { opacity: 0; transform: translateY(-10px); }
        .wrapper.open .flap { transform: rotateX(180deg); }
        .wrapper.open .wax-seal, .wrapper.open .hint-text { opacity: 0; pointer-events: none; }
        .wrapper.open { transform: translateY(120px) scale(0.9); opacity: 0.3; pointer-events: none; }
        .letter.show { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); z-index: 20; }

        .cursor::after {
            content: '│';
            animation: blink 0.8s infinite;
            color: #ab47bc;
            margin-left: 2px;
        }

        /* Option 1: Soft Pastel Highlight */
        .highlight-text {
            display: inline-block;
            font-size: 1.8rem;
            font-weight: 700;
            color: #880e4f;
            margin-top: 10px;
            padding: 2px 10px;
            background: linear-gradient(120deg, rgba(248, 187, 208, 0.7) 0%, rgba(244, 143, 177, 0.5) 100%);
            border-radius: 4px;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* Mobile Screen Styles */
        @media (max-width: 600px) {
            .flower-top-left, .flower-top-right, 
            .flower-bottom-left, .flower-bottom-right {
                font-size: 3.5rem;
            }
            
            .letter {
                width: 95vw;
                padding: 25px 20px;
                height: 80vh;
            }

            .playlist-container {
                top: 10px;
                right: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- Audio Player -->
    <audio id="bgSong" loop preload="auto">
        <source id="songSource" src="Night We Met.mp3" type="audio/mpeg">
    </audio>

    <!-- Music Selection Menu -->
    <div class="playlist-container">
        <div style="display: flex; gap: 8px;">
            <button class="audio-toggle" id="muteBtn">🔊</button>
            <button class="playlist-toggle" id="playlistToggle">🎵 Music Choice</button>
        </div>
        <div class="song-menu" id="songMenu">
            <button class="song-btn selected" data-src="Night We Met.mp3">🎵 Night We Met</button>
            <button class="song-btn" data-src="Apocalypse.mp3">🎵 Apocalypse</button>
            <button class="song-btn" data-src="The Beach.mp3">🎵 The Beach</button>
            <button class="song-btn" data-src="Glimpse Of Us.mp3">🎵 Glimpse Of Us</button>
        </div>
    </div>

    <div class="bg-decor flower-top-left">🌸🌺</div>
    <div class="bg-decor flower-top-right">🌸🦋</div>
    <div class="bg-decor flower-bottom-left">🌷🎀</div>
    <div class="bg-decor flower-bottom-right">🌸🌷</div>
    
    <div class="bg-decor charm-1">✨</div>
    <div class="bg-decor charm-2">🎀</div>
    <div class="bg-decor charm-3">🗝️</div>
    <div class="bg-decor charm-4">💎</div>
    <div class="bg-decor charm-5">💖</div>

    <div id="petalsContainer"></div>

    <div class="stage" id="stageContainer">
        <div class="top-note" id="topNote">
            I wrote it all in English cause I feel more comfortable in English to say this<br>
            It's easier this way
        </div>

        <div class="wrapper" id="envelopeWrapper">
            <div class="envelope">
                <div class="flap"></div>
                <div class="pocket"></div>
                <div class="wax-seal">🌹</div>
            </div>
            <div class="hint-text">Click to open</div>
        </div>

        <div class="letter" id="letterPaper">
            <div class="letter-content" id="typedText"></div>
            <div class="action-bar" id="actionBar">
                <button class="action-btn" id="skipBtn">⏩ Skip</button>
                <button class="action-btn" id="replayBtn">✨ Replay</button>
            </div>
        </div>
    </div>

    <script>
        const wrapper = document.getElementById('envelopeWrapper');
        const stageContainer = document.getElementById('stageContainer');
        const letterPaper = document.getElementById('letterPaper');
        const typedTextContainer = document.getElementById('typedText');
        const actionBar = document.getElementById('actionBar');
        const replayBtn = document.getElementById('replayBtn');
        const skipBtn = document.getElementById('skipBtn');
        const petalsContainer = document.getElementById('petalsContainer');
        const bgSong = document.getElementById('bgSong');
        const songSource = document.getElementById('songSource');
        const playlistToggle = document.getElementById('playlistToggle');
        const songMenu = document.getElementById('songMenu');
        const songBtns = document.querySelectorAll('.song-btn');
        const muteBtn = document.getElementById('muteBtn');

        let isOpen = false;
        let audioCtx = null;
        let isMuted = false;
        let isSkipped = false;
        let currentAnimationId = 0;

        bgSong.volume = 0.35;

        // Toggle Song Menu Visibility
        playlistToggle.addEventListener('click', () => {
            songMenu.classList.toggle('active');
        });

        // Switch Song Logic
        songBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                songBtns.forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                
                const newSrc = btn.getAttribute('data-src');
                songSource.src = newSrc;
                bgSong.load();

                if (isOpen && !isMuted) {
                    bgSong.play().catch(err => console.log("Song play blocked:", err));
                }
            });
        });

        // Mute / Unmute Logic
        muteBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            isMuted = !isMuted;

            if (isMuted) {
                bgSong.pause();
                muteBtn.textContent = '🔇';
            } else {
                muteBtn.textContent = '🔊';
                if (isOpen) {
                    bgSong.play().catch(err => console.log("Audio play blocked:", err));
                }
            }
        });

        function initTypingAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playClickSound() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600 + Math.random() * 200, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.015, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.04);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch (e) {}
        }

        function startMusic() {
            if (!isMuted) {
                bgSong.play().catch(e => console.log("Audio play blocked:", e));
            }
        }

        // Falling Petals
        const petalTypes = ['🌸', '🌺', '🍃', '✨'];
        for (let i = 0; i < 15; i++) {
            const petal = document.createElement('div');
            petal.classList.add('petal');
            petal.textContent = petalTypes[Math.floor(Math.random() * petalTypes.length)];
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.animationDuration = (Math.random() * 5 + 6) + 's';
            petal.style.animationDelay = (Math.random() * 5) + 's';
            petalsContainer.appendChild(petal);
        }

        const lines = [
            "I’ve spent a lot of time thinking about us...",
            "About where we started, and where we ended up.",
            "So I made this letter for you, to express my feelings.",
            "I'm not gonna try to convince you to stay with me. I wanted to give a proper goodbye to someone who became so important to me so quickly.",
            "I know this is what you think is the safest choice, and even though it's hard for me to accept, I respect your decision. I just wanted to say what I didn't get the chance to say properly.",
            "I really wanted it to work between us. I wanted it to be real, but it didn't work out. I respect that you're still dealing with your past and that you're not ready for another relationship. I'm also really grateful that you were honest with me and told me everything.",
            "More importantly, I wanted to say thank you to you.",
            "Thank you for coming into my life.",
            "Thank you for bringing joy to me just by texting me.",
            "Thank you for all the late-night talks which made me really want what we had to be real.",
            "Thank you for every little moment we shared, even though we were far away from each other.",
            "Thank you for everything.",
            "You changed me into a better version of myself in such a short time. And I don't think I'm gonna let go of everything so easily. But I'm also not gonna stay here forever.",
            "I hope you overcome your past and move forward. I hope you find the happiness and feelings you're looking for.",
            "And if you ever need me or just need someone to talk to, you can always reach out to me. I'll be here.",
            "I really cared about you. I loved you.",
            "Goodbye.",
            "Хайртай шүү.ᖭི༏ᖫྀ 💖"
        ];

        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        function renderFullTextInstant() {
            typedTextContainer.textContent = '';
            for (let i = 0; i < lines.length; i++) {
                const lineText = lines[i];
                const isLastLine = (i === lines.length - 1);

                let currentSpan = document.createElement('span');
                if (isLastLine) {
                    currentSpan.classList.add('highlight-text');
                }
                currentSpan.textContent = lineText;
                typedTextContainer.appendChild(currentSpan);

                if (!isLastLine) {
                    typedTextContainer.appendChild(document.createTextNode("\n\n"));
                }
            }
            typedTextContainer.classList.remove('cursor');
            actionBar.style.opacity = '1';
            skipBtn.style.display = 'none';
            letterPaper.scrollTop = letterPaper.scrollHeight;
        }

        async function typeWriter() {
            const thisAnimId = ++currentAnimationId;
            isSkipped = false;
            skipBtn.style.display = 'inline-block';
            typedTextContainer.textContent = '';
            actionBar.style.opacity = '1';
            await sleep(600);
            
            if (thisAnimId !== currentAnimationId) return;
            typedTextContainer.classList.add('cursor');

            for (let i = 0; i < lines.length; i++) {
                if (isSkipped || thisAnimId !== currentAnimationId) return;

                const lineText = lines[i];
                const isLastLine = (i === lines.length - 1);

                let currentSpan = document.createElement('span');
                if (isLastLine) {
                    currentSpan.classList.add('highlight-text');
                }
                typedTextContainer.appendChild(currentSpan);
                
                for (let j = 0; j < lineText.length; j++) {
                    if (isSkipped || thisAnimId !== currentAnimationId) return;

                    const char = lineText[j];
                    currentSpan.textContent += char;
                    playClickSound();

                    let delay = Math.random() * 25 + 35;
                    if (char === '.' || char === '?' || char === '!') delay = 700;
                    else if (char === ',') delay = 350;

                    await sleep(delay);
                    letterPaper.scrollTop = letterPaper.scrollHeight;
                }

                if (!isLastLine){
                    typedTextContainer.appendChild(document.createTextNode("\n\n"));
                }
                await sleep(400);
            }

            if (thisAnimId === currentAnimationId && !isSkipped) {
                typedTextContainer.classList.remove('cursor');
                skipBtn.style.display = 'none';
            }
        }

        wrapper.addEventListener('click', async () => {
            if (!isOpen) {
                initTypingAudio();
                if (audioCtx && audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }
                startMusic();
                isOpen = true;
                stageContainer.classList.add('open');
                wrapper.classList.add('open');

                setTimeout(() => {
                    letterPaper.classList.add('show');
                    typeWriter();
                }, 400);
            }
        });

        skipBtn.addEventListener('click', () => {
            isSkipped = true;
            renderFullTextInstant();
        });

        replayBtn.addEventListener('click', () => {
            typeWriter();
        });
    </script>
</body>
</html>
